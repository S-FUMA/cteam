{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <p>{{ message }}</p>
{% endif %}

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name" required>
  </p>
  <p>
    <label for="address">住所</label><br>
    <input type="text" id="address" name="address">
  </p>
  <p>
    <label for="latitude">緯度</label><br>
    <input type="number" id="latitude" name="latitude" step="any">
  </p>
  <p>
    <label for="longitude">経度</label><br>
    <input type="number" id="longitude" name="longitude" step="any">
  </p>
  <p>
    <label for="opening_status">開設状況</label><br>
    <select id="opening_status" name="opening_status">
      <option value="状況未登録">状況未登録</option>
      <option value="開設中">開設中</option>
      <option value="未開設">未開設</option>
    </select>
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
